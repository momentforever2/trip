<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家族旅行</title>
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11171C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家族旅行">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling column (max 640px), fixed bottom tab bar. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#E3E9E5; --ink:#18242E; --muted:#56656F; --line:#CFD8D2;
  --accent:#264A7A; --accent-ink:#FFFFFF; --accent-soft:#DAE3F0;
  --pos:#24724A; --neg:#B0432B; --warn:#93650B;
  --c1:#264A7A; --c2:#B0432B; --c3:#55702A; --c4:#86508A; --c5:#2F7A80; --c6:#A8780F; --c7:#6E7780;
  --f-display:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,40,60,.06),0 4px 14px rgba(20,40,60,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A232B; --surface-2:#24303A; --ink:#E4EAEE; --muted:#97A5AF; --line:#2E3B46;
  --accent:#8FB1E3; --accent-ink:#0E1A29; --accent-soft:#223449;
  --pos:#6CC593; --neg:#EE8D74; --warn:#E3B457;
  --c1:#8FB1E3; --c2:#EE8D74; --c3:#A6C871; --c4:#D19BD5; --c5:#6FC3C9; --c6:#E3B457; --c7:#A3ADB6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A232B; --surface-2:#24303A; --ink:#E4EAEE; --muted:#97A5AF; --line:#2E3B46;
  --accent:#8FB1E3; --accent-ink:#0E1A29; --accent-soft:#223449;
  --pos:#6CC593; --neg:#EE8D74; --warn:#E3B457;
  --c1:#8FB1E3; --c2:#EE8D74; --c3:#A6C871; --c4:#D19BD5; --c5:#6FC3C9; --c6:#E3B457; --c7:#A3ADB6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{flex:1;min-width:0}
.brand h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px}
.pill{text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;white-space:nowrap;border:0;cursor:pointer}
.pill.neg{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}

main{padding-block:14px 110px}
main .wrap{display:flex;flex-direction:column;gap:14px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap}
nav.tabs a .ic{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:8px}

/* generic */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:17px}
.sec-h h3{font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent);background:transparent}
.btn.danger.armed{background:var(--neg);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;color:var(--muted);cursor:pointer;display:inline-flex}
.icon-btn:hover{color:var(--accent);background:var(--surface-2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.day{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:7px 12px;border-radius:12px}
.chip.day b{font-family:var(--f-display);font-size:14px}
.chip.day span{font-size:11.5px;opacity:.8}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;color:var(--tc,var(--c7));background:color-mix(in srgb,var(--tc,var(--c7)) 14%,transparent);white-space:nowrap}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.pre{white-space:pre-wrap;word-break:break-word}

/* itinerary */
.day-head{display:flex;gap:10px;align-items:flex-start}
.day-head .grow{flex:1;min-width:0}
.day-head h2{font-size:20px}
.meta-line{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.plan-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.plan-tab{flex:none;border:0;background:transparent;padding:9px 12px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;display:inline-flex;gap:4px;align-items:center}
.plan-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.plan-tab .star{color:var(--warn)}
.plan-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:8px}
.chosen-note{font-size:12.5px;color:var(--warn);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl.notime li{grid-template-columns:0 1fr auto;column-gap:0}.tl.notime .body{padding-right:10px}
.tl .t{font-weight:700;font-size:14px;color:var(--accent);padding-top:1px}
.tl .body{min-width:0}
.tl .title{font-weight:700;font-size:15.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.tl .note{font-size:13.5px;color:var(--muted);margin-top:2px}
.tl .links{display:flex;gap:12px;margin-top:4px;font-size:13px}
.tl .links a{display:inline-flex;gap:3px;align-items:center;text-decoration:none;font-weight:500}

/* money */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum-grid div{min-width:0}
.sum-grid .lbl{font-size:12px;color:var(--muted)}
.sum-grid .v{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sum-grid .sub{font-size:11.5px;color:var(--muted)}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.bar span{display:block;height:100%;background:var(--sc)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--sc);margin-right:5px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;font-weight:700;white-space:nowrap}
.row .amt small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.detail{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13.5px}
.detail table{width:100%;border-collapse:collapse}
.detail td{padding:3px 0;vertical-align:top}
.detail td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.day-group h3{font-size:14px;display:flex;justify-content:space-between;color:var(--muted);font-family:var(--f-body);font-weight:700;padding:6px 0 2px}

.bal{display:grid;grid-template-columns:64px 1fr 96px;gap:10px;align-items:center;padding:6px 0}
.bal .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal .track{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.bal .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.bal .fill{position:absolute;top:0;bottom:0;border-radius:5px}
.bal .v{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.xfer{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.xfer:first-child{border-top:0}
.xfer .who{flex:1;min-width:0;font-weight:500}
.xfer .who .arrow{color:var(--muted);margin:0 4px}
.xfer .v{font-weight:700;white-space:nowrap}
.people{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.people span{font-size:11.5px;background:var(--surface-2);border-radius:5px;padding:0 6px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* wish list */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.wgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wimg{display:block;width:100%;aspect-ratio:1/1;border:0;padding:0;background:var(--surface-2);cursor:pointer;position:relative;overflow:hidden}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.wph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.wph .ic{width:36px;height:36px;opacity:.6}
.wbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.wbody b{font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.wbody small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.wfoot{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.wcheck{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.wcheck input{width:18px;height:18px;accent-color:var(--pos);margin:0}
.wcard.done .wimg img{opacity:.45}
.wcard.done b{text-decoration:line-through;color:var(--muted)}
.wbadge{position:absolute;left:6px;top:6px;background:var(--pos);color:#fff;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.btn.sm{min-height:30px;padding:4px 9px;font-size:12.5px;border-radius:8px}
.wja{font-size:22px;font-weight:700;line-height:1.35;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.wbig{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--surface-2);display:block}
.imgpick{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.imgpick .thumb{width:96px;height:96px;border-radius:12px;background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.imgpick .thumb img{width:100%;height:100%;object-fit:cover}

/* spots */
.spot{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.spot:first-child{border-top:0}
.spot .grow{flex:1;min-width:0}
.spot .nm{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,18,26,.45)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{flex:1;font-size:18px}
.sheet-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:18px;max-height:86%}}
.form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px;min-height:42px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 8px;font-size:14px;cursor:pointer}
.chks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.chks input{accent-color:var(--accent);margin:0}
.irow{padding-bottom:8px;border-bottom:1px dashed var(--line)}
.irow .io{color:var(--muted)}
.wrow{order:7;grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-2px 0 4px}
.wrow small{color:var(--muted);font-size:12px;margin-right:2px}
.wchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.wchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.irow.need .wrow small{color:var(--warn);font-weight:700}
.ires{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.ires b{text-align:right}
.irow{display:grid;grid-template-columns:1fr 1fr 84px 30px;gap:6px;margin-bottom:6px}
.irow input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;font-size:14px;min-width:0}
details summary{cursor:pointer;font-size:13.5px;font-weight:500;color:var(--accent);padding:4px 0}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.err{color:var(--neg)}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;padding-top:4px}
.actions .btn.primary{flex:1}
.preview-img{max-height:220px;border-radius:10px;display:block;margin:0 auto}
.mrow{display:grid;grid-template-columns:1fr auto 34px;gap:8px;align-items:center}
.mrow input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:16px;min-width:0}
.mrow label{font-size:13px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.pick{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:116px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
.pickbtn .ic{width:30px;height:30px}
.pickbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pickbtn:active{transform:scale(.98)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:var(--surface)}
.drop .ic{width:30px;height:30px;color:var(--accent)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:420px){.sum-grid .v{font-size:17px}.irow{grid-template-columns:1fr 70px 30px}.irow .io{grid-column:1/-1;order:5}}
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%}
.sync{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.sync.warn{color:var(--warn);font-weight:700}
.install{display:flex;gap:10px;align-items:flex-start}
.install .grow{flex:1;min-width:0}
.install img{width:44px;height:44px;border-radius:10px;flex:none}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

</head><body>

<header class="top"><div class="wrap">
  <div class="brand"><h1 id="tripName">家族日本行</h1><small id="tripDates" class="num"></small> <span id="sync" class="sync"></span></div>
  <a class="pill num" id="poolPill" href="#pool" hidden></a>
</div></header>
<main><div class="wrap" id="view"><div class="empty"><span class="spin"></span> 載入中…</div></div></main>
<nav class="tabs" aria-label="主選單"><div class="wrap" id="nav"></div></nav>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(() => {
const I = {
  plus:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg class="ic" viewBox="0 0 24 24"><path d="M3.5 8h3.2l2-3h6.6l2 3h3.2v11h-17z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  edit:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  pin:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.3-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.7 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cal:'<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>',
  wallet:'<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="12.5" rx="2"/><path d="M5.5 7l9.5-3.2V7M15.5 13.3h2"/></svg>',
  split:'<svg class="ic" viewBox="0 0 24 24"><path d="M7 4v14M4 15l3 3 3-3M17 20V6M14 9l3-3 3 3"/></svg>',
  gear:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>',
  ai:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1-5.1-1.9 5.1-1.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>',
  star:'<svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;stroke:none"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
  img:'<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8.5"/></svg>',
  bag:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>',
  link:'<svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
const TABS = [['trip','行程',I.cal],['pool','公費',I.wallet],['split','分帳',I.split],['wish','必買',I.bag],['spots','口袋名單',I.pin],['setup','設定',I.gear]];
const TYPES = {sight:['景點','--c1'],food:['美食','--c2'],move:['交通','--c3'],shop:['購物','--c4'],stay:['住宿','--c5'],other:['其他','--c7']};
const CATS = ['餐飲','交通','門票','購物','藥妝','住宿','其他'];
const CATC = {'餐飲':'--c2','交通':'--c3','門票':'--c1','購物':'--c4','藥妝':'--c6','住宿':'--c5','其他':'--c7'};
const WD = '日一二三四五六';
const DEFAULT_META = {name:'家族日本行',startDate:'',endDate:'',rate:0.21,members:[
  {id:'me',name:'我',child:false},{id:'hubby',name:'老公',child:false},{id:'sis',name:'小姑',child:false},
  {id:'mom',name:'婆婆',child:false},{id:'kid',name:'女兒',child:true}]};

const S = {status:'loading', meta:null, metaLoaded:false, days:[], pool:[], topups:[], splits:[], spots:[], wish:[], wishOwner:null, wishFilter:'all',
  tab:'trip', dayId:null, planSel:{}, poolDate:'all', open:new Set(), spotCat:'all', splitView:'min', splitPerson:'all',
  canWrite:true, ai:false, api:'', meId:null, offline:false};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2,10);
const members = () => S.meta?.members || [];
const adults = () => members().filter(m => !m.child);
const mName = id => members().find(m => m.id === id)?.name || '（已移除）';
const rate = () => Number(S.meta?.rate) > 0 ? Number(S.meta.rate) : 0.21;
const toJPY = (a,c) => c === 'TWD' ? a / rate() : a;
const toTWD = (a,c) => c === 'JPY' ? a * rate() : a;
const nf = n => Math.round(n).toLocaleString('zh-TW');
const fJ = n => (n < 0 ? '−' : '') + '¥' + nf(Math.abs(n));
const fT = n => (n < 0 ? '−' : '') + 'NT$' + nf(Math.abs(n));
const fmt = (a,c) => c === 'TWD' ? fT(a) : fJ(a);
const other = (a,c) => c === 'TWD' ? '≈ ' + fJ(toJPY(a,c)) : '≈ ' + fT(toTWD(a,c));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dLabel = iso => { if (!iso) return '未定日期'; const d = new Date(iso+'T00:00'); if (isNaN(d)) return iso; return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const fld = (label, inner) => `<label class="f"><span>${label}</span>${inner}</label>`;
const sortDays = () => [...S.days].sort((a,b) => (a.date||'9').localeCompare(b.date||'9') || (a.createdAt||0)-(b.createdAt||0));
function defaultDate(){
  const t = today(), s = S.meta?.startDate, e = S.meta?.endDate;
  if (s && e && t >= s && t <= e) return t;
  if (S.tab === 'pool' && S.poolDate !== 'all') return S.poolDate;
  const day = S.days.find(d => d.id === S.dayId);
  return day?.date || s || t;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
/* ---------- sync with Google Sheet backend ---------- */
const LS = {get(k,d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }};
let server = LS.get('trip-server', null);
let Q = LS.get('trip-queue', []);
let flushing = false, syncing = false, rev = 0;
const COLS = ['days','pool','topups','splits','spots','wish'];
function applyOp(st, op){
  const arr = st[op.col] = st[op.col] || [];
  const i = arr.findIndex(x => x.id === op.id);
  if (op.t === 'del'){ if (i >= 0) arr.splice(i, 1); return; }
  const doc = {...op.data, id:op.id};
  if (i >= 0) arr[i] = doc; else arr.push(doc);
}
function recompute(){
  const st = JSON.parse(JSON.stringify(server || {}));
  Q.forEach(op => applyOp(st, op));
  S.meta = (st.trip || []).find(d => d.id === 'meta') || null;
  S.metaLoaded = !!server || Q.length > 0;
  COLS.forEach(c => S[c] = st[c] || []);
  if (S.status === 'loading' && S.metaLoaded) S.status = 'ready';
  render();
}
async function api(body, signal){
  const r = await fetch(S.api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), redirect:'follow', signal});
  if (!r.ok) throw {code:'network'};
  const j = await r.json();
  if (!j.ok) throw {code: j.error || 'server'};
  return j;
}
async function flush(){
  if (flushing || !S.api) return; flushing = true;
  try {
    while (Q.length){
      const op = Q[0];
      try { await api(op.t === 'del' ? {action:'delete', col:op.col, id:op.id} : {action:'save', col:op.col, id:op.id, data:op.data}); }
      catch(e){
        if (e.code === 'network' || e instanceof TypeError || !e.code){ S.offline = true; renderChrome(); return; }
        toast('有一筆資料存不進去，已略過'); // validation error from server
      }
      Q.shift(); LS.set('trip-queue', Q);
      server = server || {}; applyOp(server, op); LS.set('trip-server', server); // keep local snapshot in step with what was saved
    }
    S.offline = false;
  } finally { flushing = false; }
}
async function sync(){
  if (!S.api || syncing) return; syncing = true;
  try {
    await flush();
    if (Q.length) return;
    const r0 = rev;
    const r = await fetch(S.api + '?action=all&t=' + Date.now(), {redirect:'follow'});
    const j = await r.json();
    if (!j.ok) throw j;
    if (Q.length || rev !== r0){ setTimeout(sync, 500); return; } // edits happened while loading; load again
    server = j.data; S.ai = !!j.ai; S.offline = false;
    LS.set('trip-server', server); LS.set('trip-ai', S.ai);
    recompute();
  } catch(e){ S.offline = true; if (S.status === 'loading'){ S.status = server ? 'ready' : 'error'; } renderChrome(); if (S.status === 'error') render(); }
  finally { syncing = false; }
}
function enqueue(op){ rev++; Q.push(op); LS.set('trip-queue', Q); recompute(); flush().then(() => { renderChrome(); }); return true; }
async function put(col, id, data){ return enqueue({t:'save', col, id, data:JSON.parse(JSON.stringify(data))}); }
async function del(col, id){ return enqueue({t:'del', col, id}); }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const cur = d => S.days.find(x => x.id === d.id) || d;
const clone = o => JSON.parse(JSON.stringify(o));
function sampleErr(e){
  const c = String(e?.code || '');
  if (c === 'no_key') return '還沒設定 Gemini 金鑰，請到 Apps Script 的「指令碼屬性」加入 GEMINI_API_KEY。';
  if (c === 'ai_busy') return 'Gemini 目前太忙或已達免費額度，稍等一分鐘再試。';
  if (c === 'ai_bad_json' || c === 'ai_empty') return '辨識結果格式不對，請再試一次或換一張清楚的照片。';
  if (c === 'network' || e instanceof TypeError) return '網路連不上，請確認有網路後再試。';
  return '辨識失敗，請再試一次。' + (c ? '（' + c.slice(0,80) + '）' : '');
}
/* ---------- calculations ---------- */
function poolCalc(){
  const income = S.topups.reduce((s,t) => s + toJPY((Number(t.perPerson)||0) * (t.members?.length||0), t.currency), 0);
  const spent = S.pool.reduce((s,p) => s + toJPY(Number(p.amount)||0, p.currency), 0);
  return {income, spent, remain: income - spent};
}
function shareMap(e){ // TWD per participant
  const amt = toTWD(Number(e.amount)||0, e.currency), parts = e.participants || [], out = {};
  if (!parts.length) return out;
  if (e.mode === 'custom' || e.mode === 'items') parts.forEach(id => out[id] = toTWD(Number(e.shares?.[id])||0, e.currency));
  else parts.forEach(id => out[id] = amt / parts.length);
  return out;
}
function splitCalc(){
  const ms = members(), bal = {}, debt = {};
  ms.forEach(a => { bal[a.id] = 0; debt[a.id] = {}; ms.forEach(b => debt[a.id][b.id] = 0); });
  for (const e of S.splits){
    const amt = toTWD(Number(e.amount)||0, e.currency);
    if (e.kind === 'transfer'){
      if (!(e.from in bal) || !(e.to in bal)) continue;
      bal[e.from] += amt; bal[e.to] -= amt; debt[e.to][e.from] += amt; continue;
    }
    if (!(e.payer in bal)) continue;
    bal[e.payer] += amt;
    const sh = shareMap(e);
    for (const id in sh){ if (!(id in bal)) continue; bal[id] -= sh[id]; if (id !== e.payer) debt[id][e.payer] += sh[id]; }
  }
  const pairs = [];
  for (let i=0;i<ms.length;i++) for (let j=i+1;j<ms.length;j++){
    const a = ms[i].id, b = ms[j].id, net = debt[a][b] - debt[b][a];
    if (Math.abs(net) >= 1) pairs.push(net > 0 ? {from:a,to:b,amt:net} : {from:b,to:a,amt:-net});
  }
  const cr = [], dr = [];
  ms.forEach(m => { const v = bal[m.id]; if (v > 0.5) cr.push({id:m.id,v}); else if (v < -0.5) dr.push({id:m.id,v:-v}); });
  cr.sort((a,b)=>b.v-a.v); dr.sort((a,b)=>b.v-a.v);
  const xfers = []; let i=0, j=0;
  while (i < dr.length && j < cr.length){
    const x = Math.min(dr[i].v, cr[j].v);
    if (x >= 1) xfers.push({from:dr[i].id,to:cr[j].id,amt:x});
    dr[i].v -= x; cr[j].v -= x;
    if (dr[i].v < 0.5) i++; if (cr[j].v < 0.5) j++;
  }
  return {bal, pairs, xfers};
}

/* ---------- render ---------- */
function renderChrome(){
  const m = S.meta || DEFAULT_META;
  $('#tripName').textContent = m.name || '家族日本行';
  const ds = m.startDate ? `${dLabel(m.startDate)} – ${dLabel(m.endDate)}` : '日期未定';
  $('#tripDates').textContent = `${ds} · ${members().length || 5} 人`;
  const pill = $('#poolPill');
  if (S.topups.length || S.pool.length){
    const {remain} = poolCalc();
    pill.hidden = false; pill.className = 'pill num' + (remain < 0 ? ' neg' : '');
    pill.innerHTML = `${I.wallet}<span>公費 ${fJ(remain)}</span>`;
  } else pill.hidden = true;
  const sy = $('#sync');
  if (Q.length){ sy.className = 'sync warn'; sy.textContent = (S.offline ? '離線 · ' : '上傳中 · ') + Q.length + ' 筆待同步'; }
  else if (S.offline && S.status !== 'loading'){ sy.className = 'sync warn'; sy.textContent = '離線，顯示上次資料'; }
  else { sy.className = 'sync'; sy.textContent = ''; }
  $('#nav').innerHTML = TABS.map(([k,l,ic]) => `<a href="#${k}" ${S.tab===k?'aria-current="page"':''}>${ic}<span>${l}</span></a>`).join('');
}
function render(){
  renderChrome();
  const v = $('#view');
  let h = '';
  if (S.status === 'loading') h = `<div class="empty"><span class="spin"></span> 連線中…</div>`;
  else if (S.status === 'noapi') h = `<div class="card empty"><h3>還沒連上資料庫</h3><p>請在 config.js 填入 Apps Script 網頁應用程式的網址。</p></div>`;
  else if (S.status === 'error') h = `<div class="card empty"><h3>連不上資料庫</h3><p>請確認網路，或稍後再開一次。</p><button class="btn" data-act="resync">重新連線</button></div>`;
  else if (S.metaLoaded && !S.meta) h = renderCreate();
  else {
    if (S.tab === 'trip') h += installCard();
    h += ({trip:renderTrip,pool:renderPool,split:renderSplit,wish:renderWish,spots:renderSpots,setup:renderSetup}[S.tab])();
  }
  v.innerHTML = h;
}
function renderCreate(){
  return `<div class="card empty"><h3>開始規劃這趟旅程</h3><p>建立後，預設成員是：我、老公、小姑、婆婆、女兒（小孩預設不分攤），之後都可以在「設定」修改。</p>
  ${S.canWrite ? `<button class="btn primary" data-act="meta-create">建立旅程</button>` : ''}</div>`;
}

/* trip */
function renderTrip(){
  const days = sortDays();
  if (!days.length){
    const m = S.meta;
    return `<div class="card empty"><h3>還沒有任何一天的行程</h3>
      <p>${m?.startDate && m?.endDate ? '可以依照旅程日期一次建立每一天，也可以手動新增。' : '先到「設定」填入出發與回程日期，就能一次建立每一天。'}</p>
      ${S.canWrite ? `<div class="btn-row" style="justify-content:center">${m?.startDate && m?.endDate ? `<button class="btn primary" data-act="day-auto">依日期建立每一天</button>` : ''}<button class="btn" data-act="day-add">${I.plus}新增一天</button></div>` : ''}</div>`;
  }
  if (!days.find(d => d.id === S.dayId)){ const t = days.find(d => d.date === today()); S.dayId = (t || days[0]).id; }
  const day = days.find(d => d.id === S.dayId), idx = days.indexOf(day);
  const plans = day.plans || [];
  let pid = S.planSel[day.id];
  if (!plans.find(p => p.id === pid)) pid = (plans.find(p => p.id === day.chosen) || plans[0])?.id;
  const plan = plans.find(p => p.id === pid);
  const items = plan ? [...(plan.items||[])].map((it,i)=>({...it,_i:i})).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')) : [];
  const daySpent = S.pool.filter(p => p.date === day.date).reduce((s,p)=>s+toJPY(Number(p.amount)||0,p.currency),0);
  return `
  <div class="chips" role="tablist" aria-label="選擇日期">
    ${days.map((d,i) => `<button class="chip day" data-act="day-sel" data-id="${d.id}" aria-pressed="${d.id===day.id}"><b>Day ${i+1}</b><span class="num">${esc(d.date ? dLabel(d.date) : '未定')}</span></button>`).join('')}
    ${S.canWrite ? `<button class="chip" data-act="day-add" aria-label="新增一天">${I.plus}</button>` : ''}
  </div>
  <section class="card">
    <div class="day-head"><div class="grow" style="min-width:0">
      <span class="small muted num">Day ${idx+1} · ${esc(dLabel(day.date))}</span>
      <h2>${esc(day.title || '今日行程')}</h2>
      <div class="meta-line">${day.hotel ? `<span>住宿：${esc(day.hotel)}</span>` : ''}${daySpent ? `<a href="#pool" data-act="pool-date" data-d="${esc(day.date)}">今日公費 ${fJ(daySpent)}</a>` : ''}</div>
      ${day.note ? `<p class="pre small" style="margin:6px 0 0">${esc(day.note)}</p>` : ''}
    </div>${S.canWrite ? `<button class="icon-btn" data-act="day-edit" aria-label="編輯這天">${I.edit}</button>` : ''}</div>
  </section>
  <section class="card">
    <div class="plan-tabs" role="tablist">
      ${plans.map(p => `<button class="plan-tab" role="tab" data-act="plan-sel" data-id="${p.id}" aria-selected="${p.id===pid}">${p.id===day.chosen && plans.length>1 ? `<span class="star">${I.star}</span>` : ''}${esc(p.name)}</button>`).join('')}
      ${S.canWrite ? `<button class="plan-tab" data-act="plan-add">${I.plus}方案</button>` : ''}
    </div>
    ${plan ? `
    <div class="plan-bar">
      ${plans.length > 1 ? (plan.id === day.chosen ? `<span class="chosen-note">${I.star}已決定採用這個方案</span>` : (S.canWrite ? `<button class="btn ghost" data-act="plan-choose">${I.star}採用這個方案</button>` : '<span></span>')) : `<span class="small muted">想比較別的走法？按「＋方案」新增方案二</span>`}
      ${S.canWrite ? `<span><button class="btn ghost" data-act="plan-edit">${I.edit}方案</button></span>` : ''}
    </div>
    ${items.length ? `<ul class="tl${items.some(x => x.time) ? '' : ' notime'}">${items.map(it => {
      const [tl, tc] = TYPES[it.type] || TYPES.other;
      const map = it.link || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.title + (it.area ? ' ' + it.area : ''))}`;
      return `<li><div class="t num">${esc(it.time || '')}</div><div class="body">
        <div class="title"><span class="tag" style="--tc:var(${tc})">${tl}</span>${esc(it.title)}</div>
        ${it.note ? `<div class="note pre">${esc(it.note)}</div>` : ''}
        <div class="links"><a href="${esc(map)}" target="_blank" rel="noopener">${I.pin}地圖</a>${it.link2 ? `<a href="${esc(it.link2)}" target="_blank" rel="noopener">${I.link}連結</a>` : ''}</div>
      </div>${S.canWrite ? `<button class="icon-btn" data-act="item-edit" data-i="${it._i}" aria-label="編輯">${I.edit}</button>` : '<span></span>'}</li>`; }).join('')}</ul>`
    : `<div class="empty small">這個方案還沒有安排。可以手動新增，或把筆記貼上讓 Claude 整理成時間表。</div>`}
    ${S.canWrite ? `<div class="btn-row" style="margin-top:10px"><button class="btn primary" data-act="item-add">${I.plus}新增行程</button><button class="btn" data-act="import-plan" ${S.ai ? '' : 'hidden'}>${I.ai}貼文字整理</button></div>` : ''}
    ` : `<div class="empty small">尚無方案</div>`}
  </section>`;
}

/* pool */
function renderPool(){
  const {income, spent, remain} = poolCalc();
  const nA = adults().length || 1;
  const dates = [...new Set(S.pool.map(p => p.date || ''))].sort();
  const list = S.poolDate === 'all' ? S.pool : S.pool.filter(p => (p.date||'') === S.poolDate);

    <div class="sum-grid num" style="margin-top:12px">
      <div><div class="lbl">已收公費</div><div class="v">${fJ(income)}</div><div class="sub">${S.topups.length} 次</div></div>
      <div><div class="lbl">已花費</div><div class="v">${fJ(spent)}</div><div class="sub">${S.pool.length} 筆</div></div>
      <div><div class="lbl">使用率</div><div class="v">${income ? Math.round(spent/income*100) + '%' : '—'}</div><div class="sub">${nA} 位大人分攤</div></div>
    </div>
    ${S.canWrite ? `<div class="btn-row" style="margin-top:14px">
      <button class="btn primary" data-act="receipt" data-dest="pool" ${S.ai ? '' : 'hidden'}>${I.cam}拍收據</button>
      <button class="btn ${S.ai ? '' : 'primary'}" data-act="entry-add" data-dest="pool">${I.plus}手動記帳</button>
      <button class="btn" data-act="topup-add">${I.wallet}收公費</button></div>` : ''}
  </section>
  ${S.pool.length ? `
  <div class="chips">
    <button class="chip" data-act="pool-date" data-d="all" aria-pressed="${S.poolDate==='all'}">全部</button>
    ${dates.map(d => `<button class="chip num" data-act="pool-date" data-d="${esc(d)}" aria-pressed="${S.poolDate===d}">${esc(dLabel(d))}</button>`).join('')}
  </div>
  <section class="card">
    <div class="sec-h"><h3>${S.poolDate==='all' ? '花費分佈' : esc(dLabel(S.poolDate)) + ' 花費'}</h3><b class="num">${fJ(listTotal)}</b></div>
    <div class="bar" role="img" aria-label="各分類花費比例">${CATS.filter(c=>byCat[c]).map(c => `<span style="--sc:var(${CATC[c]});width:${byCat[c]/listTotal*100}%"></span>`).join('')}</div>
    <div class="legend num">${CATS.filter(c=>byCat[c]).sort((a,b)=>byCat[b]-byCat[a]).map(c => `<span style="--sc:var(${CATC[c]})"><i></i>${c} ${fJ(byCat[c])}</span>`).join('')}</div>
  </section>
  <section class="card list">
    ${gkeys.map(k => {
      const g = groups[k].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      const tot = g.reduce((s,p)=>s+toJPY(Number(p.amount)||0,p.currency),0);
      return `<div class="day-group"><h3 class="num"><span>${esc(dLabel(k))}</span><span>${fJ(tot)}</span></h3>
      ${g.map(p => poolRow(p)).join('')}</div>`; }).join('')}
  </section>` : `<div class="card empty"><h3>還沒有公費支出</h3><p>先按「收公費」記下大家交了多少，之後每筆花費用拍收據或手動記帳加入，這裡會依日期整理。</p></div>`}
  ${S.topups.length ? `<section class="card"><div class="sec-h"><h3>公費收入紀錄</h3></div><div class="list">
    ${[...S.topups].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t => `<button class="row" data-act="topup-edit" data-id="${t.id}" ${S.canWrite?'':'disabled'}>
      <div class="grow"><div class="t1">${esc(t.note || '收公費')}</div><div class="t2 num">${esc(dLabel(t.date))} · 每人 ${fmt(Number(t.perPerson)||0,t.currency)} × ${(t.members||[]).length} 人（${(t.members||[]).map(mName).join('、')}）</div></div>
      <div class="amt num pos">+${fmt((Number(t.perPerson)||0)*(t.members||[]).length,t.currency)}</div></button>`).join('')}
  </div></section>` : ''}`;
}
function poolRow(p){
  const open = S.open.has(p.id);
  const [cl] = [p.category || '其他'];
  return `<button class="row" data-act="toggle" data-id="${p.id}" aria-expanded="${open}">
    <span class="tag" style="--tc:var(${CATC[cl]||'--c7'})">${esc(cl)}</span>

  ${open ? `<div class="detail">
    ${(p.items||[]).length ? `<table class="num">${p.items.map(it => `<tr><td>${esc(it.zh||it.orig)}${it.orig && it.zh ? `<div class="muted small">${esc(it.orig)}</div>` : ''}</td><td>${it.price!=='' && it.price!=null ? fmt(Number(it.price)||0,p.currency) : ''}</td></tr>`).join('')}</table>` : '<span class="muted">沒有明細品項</span>'}

    ${S.canWrite ? `<div style="text-align:right;margin-top:6px"><button class="btn ghost" data-act="entry-edit" data-col="pool" data-id="${p.id}">${I.edit}編輯</button></div>` : ''}
  </div>` : ''}`;
}

/* split */
function renderSplit(){
  const {bal, pairs, xfers} = splitCalc();
  const P = S.splitPerson;
  const maxAbs = Math.max(1, ...Object.values(bal).map(Math.abs));
  const ents = [...S.splits].filter(e => P==='all' || e.payer===P || e.from===P || e.to===P || (e.participants||[]).includes(P))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  const shownX = (S.splitView==='min' ? xfers : pairs).filter(x => P==='all' || x.from===P || x.to===P);
  return `
  <section class="card">
    <div class="sec-h"><h2>誰該收、誰該付</h2><span class="small muted">以台幣結算</span></div>
    <div style="margin-top:8px">${members().map(m => { const v = bal[m.id]||0, w = Math.min(50, Math.abs(v)/maxAbs*50);
      return `<div class="bal"><span class="name">${esc(m.name)}</span><span class="track"><span class="fill" style="${v>=0?`left:50%;width:${w}%;background:var(--pos)`:`right:50%;width:${w}%;background:var(--neg)`}"></span></span>
      <span class="v num ${Math.abs(v)<1?'muted':v>0?'pos':'neg'}">${Math.abs(v)<1?'已結清':(v>0?'收 ':'付 ')+fT(Math.abs(v))}</span></div>`; }).join('')}</div>
    ${S.canWrite ? `<div class="btn-row" style="margin-top:12px">
      <button class="btn primary" data-act="entry-add" data-dest="split">${I.plus}新增分帳</button>
      <button class="btn" data-act="receipt" data-dest="split" ${S.ai ? '' : 'hidden'}>${I.cam}拍收據</button>
      <button class="btn" data-act="xfer-add">記一筆還款</button></div>` : ''}
  </section>
  <div class="chips"><button class="chip" data-act="sp-person" data-id="all" aria-pressed="${P==='all'}">所有人</button>
    ${members().map(m => `<button class="chip" data-act="sp-person" data-id="${m.id}" aria-pressed="${P===m.id}">${esc(m.name)}的帳</button>`).join('')}</div>
  <section class="card">
    <div class="seg" role="group" aria-label="結算方式">
      <button data-act="sp-view" data-v="min" aria-pressed="${S.splitView==='min'}">最少轉帳次數</button>
      <button data-act="sp-view" data-v="pair" aria-pressed="${S.splitView==='pair'}">兩人之間明細</button></div>
    <p class="hint" style="margin:8px 0 4px">${S.splitView==='min' ? '把所有人的帳合併後，用最少的轉帳次數結清。' : '只看兩兩之間的帳，例如「小姑欠我多少」，互相抵銷後的淨額。'}</p>
    ${shownX.length ? shownX.map(x => `<div class="xfer"><div class="who">${esc(mName(x.from))}<span class="arrow">付給</span>${esc(mName(x.to))}</div>
      <span class="v num">${fT(x.amt)}</span>${S.canWrite ? `<button class="btn" data-act="settle" data-from="${x.from}" data-to="${x.to}" data-amt="${Math.round(x.amt)}">已付</button>` : ''}</div>`).join('')
      : `<div class="empty small">${S.splits.length ? '目前沒有需要轉帳的款項' : '新增分帳後，這裡會算出誰要付給誰'}</div>`}
  </section>
  <section class="card">
    <div class="sec-h"><h3>分帳紀錄${P!=='all' ? `（${esc(mName(P))}相關）` : ''}</h3><span class="small muted">${ents.length} 筆</span></div>
    <div class="list" style="margin-top:4px">${ents.length ? ents.map(splitRow).join('') : '<div class="empty small">還沒有紀錄。先付了機票、包車，或大家合買的東西，都可以記在這裡。</div>'}</div>
  </section>`;
}
function splitRow(e){
  const amt = Number(e.amount)||0;
  if (e.kind === 'transfer') return `<button class="row" data-act="xfer-edit" data-id="${e.id}" ${S.canWrite?'':'disabled'}>
    <span class="tag" style="--tc:var(--pos)">還款</span><div class="grow"><div class="t1">${esc(mName(e.from))} 付給 ${esc(mName(e.to))}</div><div class="t2 num">${esc(dLabel(e.date))}${e.note ? ' · ' + esc(e.note) : ''}</div></div>
    <div class="amt num">${fmt(amt,e.currency)}</div></button>`;
  const parts = e.participants || [];
  const per = e.mode === 'items' ? '依品項分' : e.mode === 'custom' ? '自訂' : '每人 ' + fmt(amt/(parts.length||1), e.currency);
  const open = S.open.has(e.id);
  return `<button class="row" data-act="toggle" data-id="${e.id}" aria-expanded="${open}">
    <div class="grow"><div class="t1">${esc(e.title)}</div><div class="t2 num">${esc(dLabel(e.date))} · ${esc(mName(e.payer))} 先付 · ${per}</div>
    <div class="people">${parts.map(id => `<span>${esc(mName(id))}</span>`).join('')}</div></div>
    <div class="amt num">${fmt(amt,e.currency)}<small>${other(amt,e.currency)}</small></div></button>
  ${open ? `<div class="detail"><table class="num">${parts.map(id => `<tr><td>${esc(mName(id))}${id===e.payer?' <span class="muted small">（付款人）</span>':''}</td><td>${fmt(e.mode==='custom' || e.mode==='items' ? Number(e.shares?.[id])||0 : amt/(parts.length||1), e.currency)}</td></tr>`).join('')}</table>
    ${(e.items||[]).length ? `<p class="small muted" style="margin:8px 0 2px">明細</p><table class="num">${e.items.map(it => `<tr><td>${esc(it.zh||it.orig)}${it.orig && it.zh ? `<div class="muted small">${esc(it.orig)}</div>` : ''}${e.mode==='items' ? `<div class="small" style="color:var(--accent)">${(it.who&&it.who.length ? it.who.map(mName) : ['沒指定，大家分']).join('、')}</div>` : ''}</td><td>${it.price!==''&&it.price!=null ? fmt(Number(it.price)||0,e.currency) : ''}</td></tr>`).join('')}</table>` : ''}
    ${e.note ? `<p class="pre" style="margin:8px 0 0">${esc(e.note)}</p>` : ''}
    ${e.photo ? `<p style="margin:6px 0 0"><a href="${esc(e.photo)}" target="_blank" rel="noopener">${I.cam} 看收據照片</a></p>` : ''}
    ${S.canWrite ? `<div style="text-align:right;margin-top:6px"><button class="btn ghost" data-act="entry-edit" data-col="splits" data-id="${e.id}">${I.edit}編輯</button></div>` : ''}</div>` : ''}`;
}

/* wish list */
const wishImg = (w, cls='') => w.image ? `<img src="${esc(w.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" class="${cls}" onerror="this.outerHTML='<div class=&quot;wph&quot;>${I.bag.replace(/"/g,'&quot;')}</div>'">` : `<div class="wph">${I.bag}</div>`;
const hasInMine = src => S.meId && S.wish.some(w => w.owner === S.meId && (w.id === src.id || w.from === src.id || (src.from && w.id === src.from) || (w.name && w.name === src.name)));
function renderWish(){
  const ids = members().map(m => m.id);
  if (!ids.includes(S.wishOwner)) S.wishOwner = ids.includes(S.meId) ? S.meId : ids[0];
  const owner = S.wishOwner, mine = owner === S.meId;
  const all = S.wish.filter(w => w.owner === owner);
  const list = all.filter(w => S.wishFilter === 'all' || (S.wishFilter === 'todo' ? !w.bought : w.bought))
    .sort((a,b) => (a.bought?1:0) - (b.bought?1:0) || (a.createdAt||0) - (b.createdAt||0));
  const done = all.filter(w => w.bought).length;
  const est = all.reduce((s,w) => s + (Number(w.price)||0) * (Number(w.qty)||1), 0);
  return `
  ${!S.meId ? `<section class="card"><b>先選這支手機是誰的</b><p class="hint" style="margin:2px 0 0">選了之後，才能把別人清單裡的東西加到自己的清單。</p>
    <div class="who">${members().map(x => `<button class="chip" data-act="me-set" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div></section>` : ''}
  <div class="chips">${members().map(m => { const n = S.wish.filter(w => w.owner === m.id).length;
    return `<button class="chip" data-act="wish-owner" data-id="${m.id}" aria-pressed="${owner===m.id}">${esc(m.name)}${m.id===S.meId?'（我）':''} ${n}</button>`; }).join('')}</div>
  <section class="card">
    <div class="sec-h"><h2>${esc(mName(owner))}的必買清單</h2><span class="small muted num">已買 ${done}/${all.length}${est ? ' · 約 ' + fJ(est) : ''}</span></div>
    <p class="hint" style="margin-top:4px">${mine ? '點商品可以看大圖和日文名稱，到店裡直接給店員看。' : '看到喜歡的，按「加到我的」就會出現在你的清單。'}</p>
    <div class="btn-row" style="margin-top:10px"><button class="btn primary" data-act="wish-add">${I.plus}新增到${mine ? '我' : esc(mName(owner))}的清單</button></div>
  </section>
  ${all.length ? `<div class="seg" role="group" aria-label="篩選">
    <button data-act="wish-filter" data-f="all" aria-pressed="${S.wishFilter==='all'}">全部 ${all.length}</button>
    <button data-act="wish-filter" data-f="todo" aria-pressed="${S.wishFilter==='todo'}">還沒買 ${all.length-done}</button>
    <button data-act="wish-filter" data-f="done" aria-pressed="${S.wishFilter==='done'}">已買 ${done}</button></div>` : ''}
  ${list.length ? `<div class="wgrid">${list.map(w => {
    const inMine = !mine && hasInMine(w);
    return `<article class="wcard ${w.bought?'done':''}">
      <button class="wimg" data-act="wish-open" data-id="${w.id}" aria-label="${esc(w.name)}">${wishImg(w)}${w.bought ? '<span class="wbadge">已買</span>' : ''}</button>
      <div class="wbody"><b>${esc(w.name)}</b>${w.nameJa ? `<small>${esc(w.nameJa)}</small>` : ''}
        ${w.store || w.price ? `<small class="num">${esc(w.store||'')}${w.store && w.price ? ' · ' : ''}${w.price ? fJ(Number(w.price)) + ((Number(w.qty)||1) > 1 ? ' ×' + w.qty : '') : ''}</small>` : ''}
        <div class="wfoot">${mine || !S.meId
          ? `<label class="wcheck"><input type="checkbox" data-act="wish-bought" data-id="${w.id}" ${w.bought?'checked':''}>已買</label>`
          : `<button class="btn sm ${inMine?'':'primary'}" data-act="wish-copy" data-id="${w.id}" ${inMine?'disabled':''}>${inMine ? '已在我的清單' : I.plus + '加到我的'}</button>`}</div>
      </div></article>`; }).join('')}</div>`
  : `<div class="card empty">${all.length ? '這個分類沒有東西' : (mine ? '<h3>清單還是空的</h3><p>按「新增」加入想買的東西，可以拍照或從相簿選商品圖片。</p>' : `<h3>${esc(mName(owner))}還沒有加東西</h3><p>也可以幫${esc(mName(owner))}新增。</p>`)}</div>`}`;
}
async function copyWish(src){
  if (!S.meId){ toast('請先選這支手機是誰的'); return; }
  if (hasInMine(src)){ toast('已經在你的清單了'); return; }
  const {id, owner, bought, createdAt, updatedAt, ...rest} = src;
  await put('wish', newId(), {...rest, owner:S.meId, bought:false, from:src.id, createdAt:Date.now()});
  toast('已加到' + mName(S.meId) + '的清單');
}
function openWishView(w){
  const mine = w.owner === S.meId, inMine = !mine && hasInMine(w);

  });
}

        <span class="hint" id="wf-imsg">${S.ai && !editing ? '拍照或選照片後，會自動辨識商品並填入品名和日文名稱。' : ''}</span>
      </div></div>
      <input id="wf-cam" type="file" accept="image/*" capture="environment" hidden><input id="wf-file" type="file" accept="image/*" hidden></div>
    ${fld('品名', `<input id="wf-name" type="text" value="${esc(d.name)}" placeholder="例如：合利他命 EX Plus">`)}
    ${fld('日文名稱（給店員看，可空白）', `<input id="wf-ja" type="text" value="${esc(d.nameJa)}" placeholder="例如：アリナミンEXプラス">`)}
    <div class="row2">${fld('哪裡買', `<input id="wf-store" type="text" value="${esc(d.store)}" placeholder="例如：松本清">`)}${fld('參考價格（日圓）', `<input id="wf-price" type="number" inputmode="decimal" min="0" value="${esc(d.price)}">`)}</div>
    <div class="row2">${fld('數量', `<input id="wf-qty" type="number" inputmode="numeric" min="1" value="${esc(d.qty)}">`)}${fld('放在誰的清單', memberSel('wf-owner', d.owner))}</div>
    ${fld('備註', `<textarea id="wf-note" rows="2" placeholder="口味、規格、幫誰買…">${esc(d.note)}</textarea>`)}
    <p class="hint err" id="wf-err" hidden></p>
    <div class="actions">${editing ? `<button type="button" class="btn danger" id="wf-del">刪除</button>` : ''}<button class="btn primary" type="submit">儲存</button></div>
  </form>`, b => {
    const thumb = $('#wf-thumb', b), msg = $('#wf-imsg', b), clr = $('#wf-clear', b);
    const show = () => { thumb.innerHTML = image ? `<img src="${esc(image)}" alt="" referrerpolicy="no-referrer">` : I.bag; clr.hidden = !image; };
    let uploading = false;
    const onPick = async ev => {
      const f = ev.target.files?.[0]; if (!f) return; ev.target.value = '';
      const local = URL.createObjectURL(f); thumb.innerHTML = `<img src="${local}" alt="">`;
      uploading = true;
      const t0 = Date.now();
      let upMsg = '上傳圖片中', aiMsg = S.ai ? '辨識商品中' : '';
      const paint = () => { const sec = Math.round((Date.now()-t0)/1000); msg.innerHTML = (uploading || aiMsg.endsWith('中')) ? `<span class="spin"></span> ${[upMsg, aiMsg].filter(Boolean).join('、')}… ${sec} 秒` : [upMsg, aiMsg].filter(Boolean).join('。'); };
      const tick = setInterval(() => { if (!msg.isConnected) return clearInterval(tick); paint(); }, 1000); paint();
      try {
        const big = await shrinkImage(f, 1000);
        const small = S.ai ? await shrinkImage(f, 768) : null;
        // 上傳照片和辨識商品同時進行
        const up = api({action:'upload', image: big, mime:'image/jpeg'}).then(j => { image = j.url; upMsg = '圖片已上傳'; })
          .catch(e => { upMsg = e instanceof TypeError || e?.code === 'network' ? '沒有網路，圖片傳不上去' : '圖片上傳失敗'; image = d.image || ''; })
          .finally(() => { uploading = false; clr.hidden = !image; if (!image) show(); paint(); });
        const ai = !small ? Promise.resolve() : api({action:'analyze', image: small, mime:'image/jpeg'}).then(j => {
          const info = j.info || {}; let n = 0;
          const fill = (sel, v) => { const el = $(sel, b); if (el && v && !String(el.value).trim()){ el.value = v; n++; } };
          fill('#wf-name', info.name); fill('#wf-ja', info.nameJa); fill('#wf-store', info.store);
          if (Number(info.price) > 0) fill('#wf-price', String(Math.round(Number(info.price))));
          fill('#wf-note', [info.brand ? '品牌：' + info.brand : '', info.note || ''].filter(Boolean).join('\n'));
          aiMsg = n ? `已自動填入 ${n} 欄（${Math.round((Date.now()-t0)/1000)} 秒），有錯可以直接改` : '已辨識，原本有內容的欄位沒有覆蓋';
        }).catch(() => { aiMsg = '商品辨識失敗，請手動填寫'; }).finally(paint);
        await Promise.all([up, ai]);
      } finally { clearInterval(tick); URL.revokeObjectURL(local); paint(); }
    };
    $('#wf-cam', b).onchange = onPick; $('#wf-file', b).onchange = onPick;
    $('#wf-url', b).onchange = ev => { const u = ev.target.value.trim(); if (/^https?:\/\//.test(u)){ image = u; msg.textContent = ''; show(); } };
    clr.onclick = () => { image = ''; show(); };
    if (editing) armDelete($('#wf-del', b), () => del('wish', w.id));
    $('#wf', b).onsubmit = async ev => { ev.preventDefault();
      const err = $('#wf-err', b);
      if (uploading){ err.textContent = '圖片還在上傳，請稍等'; err.hidden = false; return; }
      const name = $('#wf-name', b).value.trim(); if (!name){ err.textContent = '請填寫品名'; err.hidden = false; return; }
      const data = {...d, name, nameJa:$('#wf-ja', b).value.trim(), image, store:$('#wf-store', b).value.trim(), price:$('#wf-price', b).value === '' ? '' : Number($('#wf-price', b).value),
        qty:Math.max(1, Number($('#wf-qty', b).value)||1), owner:$('#wf-owner', b).value, note:$('#wf-note', b).value.trim(), createdAt:d.createdAt || Date.now(), updatedAt:Date.now()};
      delete data.id;
      if (await put('wish', editing ? w.id : newId(), data)){ S.wishOwner = data.owner; closeModal(); toast('已儲存'); } };
  });
}

/* ---------- modals ---------- */
let sampleCtl = null;
function openModal(title, html, mount){
  const m = $('#modal');
  m.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="關閉">${I.x}</button></div>
    <div class="sheet-b">${html}</div></div>`;
  m.hidden = false; document.body.classList.add('lock');
  if (mount) mount($('.sheet-b', m));
  const f = $('input:not([type=checkbox]):not([type=file]),textarea', m); if (f && matchMedia('(hover:hover)').matches) f.focus();
}
function closeModal(){ sampleCtl?.abort(); sampleCtl = null; const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.classList.remove('lock'); }
function armDelete(btn, fn){
  btn.addEventListener('click', async () => {
    if (!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent = '再按一次確認刪除'; setTimeout(()=>{ if (btn.isConnected){ btn.classList.remove('armed'); btn.textContent = '刪除'; } }, 3500); return; }
    btn.disabled = true; if (await fn()){ closeModal(); toast('已刪除'); } else btn.disabled = false;
  });
}
const memberChecks = (name, sel) => `<div class="chks">${members().map(m => `<label><input type="checkbox" name="${name}" value="${m.id}" ${sel.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join('')}</div>`;
const curSel = (id, v) => `<select id="${id}"><option value="JPY" ${v!=='TWD'?'selected':''}>日圓 ¥</option><option value="TWD" ${v==='TWD'?'selected':''}>台幣 NT$</option></select>`;
const memberSel = (id, v) => `<select id="${id}">${members().map(m => `<option value="${m.id}" ${m.id===v?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`;

/* entry (pool or split) */
function openEntry(opt){
  const ad = adults().map(m=>m.id);
  const d = Object.assign({date:defaultDate(), title:'', orig:'', amount:'', currency:'JPY', category:'餐飲', items:[], note:'',
    payer:members().some(m => m.id === S.meId) ? S.meId : (members().some(m => m.id === 'me') ? 'me' : members()[0]?.id), participants:ad, mode:'equal', shares:{}}, clone(opt.data || {}));
  let dest = opt.dest || 'pool';
  const editing = !!opt.id;
  const html = `<form class="form" id="ef" novalidate>
    ${opt.receipt ? `<p class="hint">已辨識並翻譯，請確認內容後選擇要記到哪裡。</p>` : ''}
    <div class="seg" role="group" aria-label="記到哪裡"><button type="button" data-d="pool" aria-pressed="${dest==='pool'}">公費支出</button><button type="button" data-d="split" aria-pressed="${dest==='split'}">分帳（有人先付）</button></div>
    ${fld('項目名稱', `<input id="ef-title" type="text" value="${esc(d.title)}" placeholder="例如：午餐 一蘭拉麵">`)}
    ${fld('原文（收據上的名稱，可空白）', `<input id="ef-orig" type="text" value="${esc(d.orig)}">`)}
    <div class="row2">${fld('金額', `<input id="ef-amt" type="number" inputmode="decimal" min="0" step="any" value="${esc(d.amount)}">`)}${fld('幣別', curSel('ef-cur', d.currency))}</div>
    <div class="row2">${fld('日期', `<input id="ef-date" type="date" value="${esc(d.date)}">`)}${fld('分類', `<select id="ef-cat">${CATS.map(c=>`<option ${c===d.category?'selected':''}>${c}</option>`).join('')}</select>`)}</div>
    <div id="ef-split" class="form" ${dest==='split'?'':'hidden'}>
      ${fld('誰先付的', memberSel('ef-payer', d.payer))}
      <div class="seg" role="group" aria-label="分法"><button type="button" data-m="equal" aria-pressed="${d.mode==='equal'||!d.mode}">平均分</button><button type="button" data-m="items" aria-pressed="${d.mode==='items'}">依品項分</button>${d.mode==='custom' ? `<button type="button" data-m="custom" aria-pressed="true">自訂金額</button>` : ''}</div>
      <div class="f"><span id="ef-plabel">分給誰（打勾的人一起分）</span>${memberChecks('ef-p', d.participants)}
        <div class="btn-row" style="margin-top:4px"><button type="button" class="btn ghost" data-pre="adults">大人 ${ad.length} 位</button><button type="button" class="btn ghost" data-pre="all">全部 ${members().length} 位</button><button type="button" class="btn ghost" data-pre="none">清除</button></div></div>
      <div id="ef-custom" class="form" ${d.mode==='custom'?'':'hidden'}></div>
      <p class="hint num" id="ef-share"></p>
    </div>
    <details id="ef-det" ${d.items.length||d.mode==='items'?'open':''}><summary>明細品項（<span id="ef-icount">${d.items.length}</span>）</summary>
      <p class="hint" id="ef-ihint" hidden style="margin:4px 0 8px">在每個品項下面點選是誰的。點兩個人以上就由他們平分；沒點的品項（例如稅金、袋子）由上面打勾的人平分。</p>
      <div id="ef-items" style="margin-top:6px"></div><button type="button" class="btn ghost" id="ef-additem">${I.plus}加一項</button>
      <div class="detail" id="ef-ires" hidden style="margin-top:8px"></div></details>
    ${fld('備註', `<textarea id="ef-note" rows="2">${esc(d.note)}</textarea>`)}
    <p class="hint err" id="ef-err" hidden></p>
    <div class="actions">${editing ? `<button type="button" class="btn danger" id="ef-del">刪除</button>` : ''}<button class="btn primary" type="submit">儲存</button></div>
  </form>`;
  openModal(editing ? '編輯紀錄' : (opt.receipt ? '收據內容確認' : '記一筆'), html, b => {
    let mode = ['custom','items'].includes(d.mode) ? d.mode : 'equal';
    const shares = Object.assign({}, d.shares);
    const parts = () => $$('input[name=ef-p]:checked', b).map(x => x.value);
    const itemsBox = $('#ef-items', b);
    const addItem = (it={}) => { const r = document.createElement('div'); r.className = 'irow';
      const who = new Set(Array.isArray(it.who) ? it.who : []);
      r.innerHTML = `<input class="iz" placeholder="中文品名" value="${esc(it.zh||'')}"><input class="io" placeholder="原文" value="${esc(it.orig||'')}"><input class="ip num" type="number" step="any" inputmode="decimal" placeholder="金額" value="${esc(it.price??'')}"><button type="button" class="icon-btn" aria-label="移除">${I.x}</button>
        <div class="wrow" ${mode==='items'?'':'hidden'}><small>誰的：</small>${members().map(m => `<button type="button" class="wchip" data-w="${m.id}" aria-pressed="${who.has(m.id)}">${esc(m.name)}</button>`).join('')}</div>`;
      r._who = who;
      $('.icon-btn', r).onclick = () => { r.remove(); $('#ef-icount', b).textContent = $$('.irow', itemsBox).length; updShare(); };
      $$('.wchip', r).forEach(c => c.onclick = () => { const id = c.dataset.w; who.has(id) ? who.delete(id) : who.add(id); c.setAttribute('aria-pressed', who.has(id)); updShare(); });
      $('.ip', r).oninput = () => updShare();
      itemsBox.append(r); $('#ef-icount', b).textContent = $$('.irow', itemsBox).length; };
    d.items.forEach(addItem);
    $('#ef-additem', b).onclick = () => { addItem(); updShare(); };
    const readItems = () => $$('.irow', itemsBox).map(r => ({r, price:Number($('.ip',r).value)||0, who:[...r._who]}));
    const itemShares = () => { // returns {shares, base, itemsSum, unassigned}
      const p = parts(), base = {}; let itemsSum = 0, unassigned = 0;
      readItems().forEach(it => {
        if (!it.price) return; itemsSum += it.price;
        const who = it.who.length ? it.who : p; if (!it.who.length) unassigned++;
        who.forEach(id => base[id] = (base[id]||0) + it.price / (who.length||1));
      });
      const amt = Number($('#ef-amt', b).value) || itemsSum, k = itemsSum ? amt / itemsSum : 0, shares = {};
      Object.keys(base).forEach(id => { if (base[id] > 0) shares[id] = base[id] * k; });
      return {shares, base, itemsSum, amt, unassigned};
    };
    const drawCustom = () => {
      const box = $('#ef-custom', b);
      box.innerHTML = parts().map(id => `<div class="row2" style="align-items:center"><span>${esc(mName(id))}</span><input type="number" step="any" inputmode="decimal" data-sh="${id}" value="${esc(shares[id] ?? '')}" style="border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:16px;min-width:0"></div>`).join('');
      $$('input[data-sh]', box).forEach(inp => inp.oninput = () => { shares[inp.dataset.sh] = inp.value; updShare(); });
    };
    const updShare = () => {
      const amt = Number($('#ef-amt', b).value)||0, cur = $('#ef-cur', b).value, p = parts(), out = $('#ef-share', b);
      const res = $('#ef-ires', b); res.hidden = mode !== 'items' || dest !== 'split';
      if (mode === 'items' && dest === 'split'){
        $$('.irow', itemsBox).forEach(r => r.classList.toggle('need', !r._who.size));
        const {shares, itemsSum, amt: total, unassigned} = itemShares();
        if (!itemsSum){ out.textContent = '請在下方明細加入品項和金額，再點選每項是誰的。'; res.innerHTML = '<span class="muted">還沒有品項金額</span>'; return; }
        const diff = total - itemsSum;
        const ids = members().map(m => m.id).filter(id => shares[id]);
        res.innerHTML = `<b style="display:block;text-align:left;margin-bottom:6px">每個人要負擔</b><div class="ires num">${ids.map(id => `<span>${esc(mName(id))}</span><b>${fmt(shares[id],cur)}</b>`).join('')}<span class="muted">合計</span><b>${fmt(total,cur)}</b></div>`
          + (Math.abs(diff) >= 1 ? `<p class="hint" style="margin-top:6px">收據總額比品項加總${diff>0?'多':'少'} ${fmt(Math.abs(diff),cur)}（${diff>0?'稅金或服務費':'折扣'}），已依每人品項金額比例${diff>0?'分攤':'扣除'}。</p>` : '')
          + (unassigned ? `<p class="hint" style="margin-top:6px">有 ${unassigned} 項沒指定，由上面打勾的 ${p.length} 人平分${p.length ? '' : '（目前沒人打勾，請勾選）'}。</p>` : '');
        out.textContent = `依品項分：${ids.length} 人負擔，詳見下方明細的計算結果`;
        return;
      }
      if (!p.length){ out.textContent = '請至少勾選一位'; return; }
      if (mode === 'equal') out.textContent = `${p.length} 人平均，每人 ${fmt(amt/p.length,cur)}（${other(amt/p.length,cur)}）`;
      else { const sum = p.reduce((s,id)=>s+(Number(shares[id])||0),0), left = amt - sum;
        out.textContent = Math.abs(left) < 0.5 ? `已分配完 ${fmt(sum,cur)}` : `已分配 ${fmt(sum,cur)}，${left>0?'還差':'超過'} ${fmt(Math.abs(left),cur)}`; }

        if (mode !== 'items') Object.assign(data, {kind:'expense', payer:$('#ef-payer', b).value, participants:p, mode});
        if (mode === 'custom'){ const sh = {}; p.forEach(id => sh[id] = Number(shares[id])||0);

      if (await put(col, id, data)){

      } else $('button[type=submit]', b).disabled = false;
    };
  });
}

/* receipt */
function shrinkImage(file, maxSide){
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = maxSide || 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.78).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad({code:'bad_image'}); };
    img.src = url;
  });
}

function openTopup(t){
  const editing = !!t; t = t || {date:defaultDate(), perPerson:'', currency:'JPY', members:adults().map(m=>m.id), note:''};
  openModal(editing ? '編輯公費收入' : '收公費', `<form class="form" id="tf">
    <div class="row2">${fld('每人交多少', `<input id="tf-amt" type="number" inputmode="decimal" step="any" min="0" value="${esc(t.perPerson)}">`)}${fld('幣別', curSel('tf-cur', t.currency))}</div>
    <div class="f"><span>誰有交</span>${memberChecks('tf-m', t.members)}</div>
    ${fld('日期', `<input id="tf-date" type="date" value="${esc(t.date)}">`)}
    ${fld('備註', `<input id="tf-note" type="text" value="${esc(t.note)}" placeholder="例如：第一次收公費">`)}
    <p class="hint num" id="tf-sum"></p>
    <div class="actions">${editing ? `<button type="button" class="btn danger" id="tf-del">刪除</button>` : ''}<button class="btn primary" type="submit">儲存</button></div></form>`, b => {
    const upd = () => { const a = Number($('#tf-amt', b).value)||0, n = $$('input[name=tf-m]:checked', b).length, c = $('#tf-cur', b).value; $('#tf-sum', b).textContent = `共 ${fmt(a*n,c)}（${n} 人）`; };
    b.oninput = upd; b.onchange = upd; upd();
    if (editing) armDelete($('#tf-del', b), () => del('topups', t.id));
    $('#tf', b).onsubmit = async ev => { ev.preventDefault();
      const per = Number($('#tf-amt', b).value), ms = $$('input[name=tf-m]:checked', b).map(x => x.value);
      if (!(per > 0) || !ms.length){ $('#tf-sum', b).textContent = '請填金額並勾選交錢的人'; return; }
      if (await put('topups', editing ? t.id : newId(), {perPerson:per, currency:$('#tf-cur', b).value, members:ms, date:$('#tf-date', b).value, note:$('#tf-note', b).value.trim(), createdAt:t.createdAt || Date.now()})){ closeModal(); toast('已記錄公費'); } };
  });
}
function openXfer(x){
  const editing = !!x?.id; x = Object.assign({from:'', to:'me', amount:'', currency:'TWD', date:today(), note:''}, x || {});
  if (!x.from) x.from = members().find(m => m.id !== x.to)?.id;
  openModal(editing ? '編輯還款' : '記一筆還款', `<form class="form" id="xf">
    <div class="row2">${fld('誰付錢', memberSel('xf-from', x.from))}${fld('付給誰', memberSel('xf-to', x.to))}</div>
    <div class="row2">${fld('金額', `<input id="xf-amt" type="number" inputmode="decimal" step="any" min="0" value="${esc(x.amount)}">`)}${fld('幣別', curSel('xf-cur', x.currency))}</div>
    ${fld('日期', `<input id="xf-date" type="date" value="${esc(x.date)}">`)}
    ${fld('備註', `<input id="xf-note" type="text" value="${esc(x.note)}" placeholder="例如：LINE Pay 轉帳">`)}
    <p class="hint err" id="xf-err" hidden></p>
    <div class="actions">${editing ? `<button type="button" class="btn danger" id="xf-del">刪除</button>` : ''}<button class="btn primary" type="submit">儲存</button></div></form>`, b => {
    if (editing) armDelete($('#xf-del', b), () => del('splits', x.id));
    $('#xf', b).onsubmit = async ev => { ev.preventDefault();
      const from = $('#xf-from', b).value, to = $('#xf-to', b).value, amount = Number($('#xf-amt', b).value), e = $('#xf-err', b);
      if (from === to){ e.textContent = '付款人和收款人不能是同一位'; e.hidden = false; return; }
      if (!(amount > 0)){ e.textContent = '請填寫金額'; e.hidden = false; return; }
      if (await put('splits', editing ? x.id : newId(), {kind:'transfer', from, to, amount, currency:$('#xf-cur', b).value, date:$('#xf-date', b).value, note:$('#xf-note', b).value.trim(), createdAt:x.createdAt || Date.now()})){ closeModal(); toast('已記錄還款'); } };
  });
}
function openSetup(){
  const m = clone(S.meta || DEFAULT_META);
  openModal('編輯旅程設定', `<form class="form" id="stf">
    ${fld('旅程名稱', `<input id="st-name" type="text" value="${esc(m.name)}">`)}
    <div class="row2">${fld('出發日', `<input id="st-start" type="date" value="${esc(m.startDate)}">`)}${fld('回程日', `<input id="st-end" type="date" value="${esc(m.endDate)}">`)}</div>
    ${fld('匯率：1 日圓 = ? 台幣', `<input id="st-rate" type="number" step="0.0001" min="0" inputmode="decimal" value="${esc(m.rate)}">`)}
    <div class="f"><span>成員（勾選「小孩」的人不收公費，分帳時預設不分攤）</span><div id="st-mem" class="form" style="gap:8px"></div>
      <button type="button" class="btn ghost" id="st-add" style="align-self:flex-start">${I.plus}新增成員</button></div>
    <p class="hint err" id="st-err" hidden></p>
    <div class="actions"><span></span><button class="btn primary" type="submit">儲存</button></div></form>`, b => {
    const box = $('#st-mem', b);
    const addRow = mm => { const r = document.createElement('div'); r.className = 'mrow'; r.dataset.id = mm.id;
      r.innerHTML = `<input type="text" value="${esc(mm.name)}" aria-label="名字"><label><input type="checkbox" ${mm.child?'checked':''}>小孩</label><button type="button" class="icon-btn" aria-label="移除">${I.x}</button>`;
      $('button', r).onclick = () => r.remove(); box.append(r); };
    m.members.forEach(addRow);
    $('#st-add', b).onclick = () => { addRow({id:'m'+rid(), name:'', child:false}); $('input', box.lastChild).focus(); };
    $('#stf', b).onsubmit = async ev => { ev.preventDefault();
      const ms = $$('.mrow', box).map(r => ({id:r.dataset.id, name:$('input[type=text]', r).value.trim(), child:$('input[type=checkbox]', r).checked})).filter(x => x.name);
      const e = $('#st-err', b);
      if (!ms.length){ e.textContent = '至少要有一位成員'; e.hidden = false; return; }
      const nm = {name:$('#st-name', b).value.trim() || '家族日本行', startDate:$('#st-start', b).value, endDate:$('#st-end', b).value, rate:Number($('#st-rate', b).value) || 0.21, members:ms};
      if (nm.startDate && nm.endDate && nm.endDate < nm.startDate){ e.textContent = '回程日不能早於出發日'; e.hidden = false; return; }
      if (await put('trip', 'meta', nm)){ closeModal(); toast('設定已更新'); } };
  });
}

/* ---------- actions ---------- */
const A = {
  close: () => closeModal(),
  'meta-create': async () => { if (await put('trip','meta', clone(DEFAULT_META))) toast('旅程已建立'); },
  'day-sel': d => { S.dayId = d.id; render(); },
  'day-add': () => openDay(null),
  'day-edit': () => openDay(S.days.find(d => d.id === S.dayId)),
  'day-auto': async () => {
    const m = S.meta, have = new Set(S.days.map(d => d.date)); let n = 0;
    for (let t = new Date(m.startDate+'T00:00'); isoOf(t) <= m.endDate && n < 31; t.setDate(t.getDate()+1)){
      const iso = isoOf(t); if (have.has(iso)) continue;
      const pid = rid(); if (!await put('days', newId(), {date:iso, title:'', hotel:'', note:'', plans:[{id:pid,name:'方案一',items:[]}], chosen:pid, createdAt:Date.now()+n})) break; n++;
    }
    toast(`已建立 ${n} 天`);
  },
  'plan-sel': d => { S.planSel[S.dayId] = d.id; render(); },
  'plan-add': async () => { const day = S.days.find(d => d.id === S.dayId); const nd = clone(cur(day)); const np = {id:rid(), name:'方案' + '一二三四五六七八九十'[Math.min(nd.plans.length,9)], items:[]}; nd.plans.push(np);
    if (await saveDay(nd)){ S.planSel[day.id] = np.id; render(); } },
  'plan-choose': async () => { const day = S.days.find(d => d.id === S.dayId); const nd = clone(cur(day)); nd.chosen = currentPlanId(day); if (await saveDay(nd)) toast('已設為採用方案'); },
  'plan-edit': () => openPlanEdit(),
  'item-add': () => openItem(null),
  'item-edit': d => openItem(+d.i),
  'import-plan': () => openImport('plan'),
  'import-spots': () => openImport('spots'),
  receipt: d => openReceipt(d.dest),
  'entry-add': d => openEntry({dest:d.dest}),
  'entry-edit': d => { const col = d.col; const doc = S[col === 'pool' ? 'pool' : 'splits'].find(x => x.id === d.id); if (doc){ const {id, ...data} = doc; openEntry({dest: col === 'pool' ? 'pool' : 'split', col, id, data}); } },
  toggle: d => { S.open.has(d.id) ? S.open.delete(d.id) : S.open.add(d.id); render(); },
  'pool-date': d => { S.poolDate = d.d; if (S.tab !== 'pool') location.hash = 'pool'; render(); },
  'topup-add': () => openTopup(null),
  'topup-edit': d => openTopup(S.topups.find(t => t.id === d.id)),
  'sp-view': d => { S.splitView = d.v; render(); },
  'sp-person': d => { S.splitPerson = d.id; render(); },
  settle: d => openXfer({from:d.from, to:d.to, amount:+d.amt, currency:'TWD', note:'結清'}),
  'xfer-add': () => openXfer(null),
  'xfer-edit': d => openXfer(S.splits.find(x => x.id === d.id)),
  'spot-add': () => openSpot(null),
  'spot-edit': d => openSpot(S.spots.find(s => s.id === d.id)),
  'spot-cat': d => { S.spotCat = d.c; render(); },
  'spot-to-plan': (d, ev) => { ev.preventDefault(); const s = S.spots.find(x => x.id === d.id); if (!s) return;
    if (!S.dayId) S.dayId = sortDays()[0]?.id; location.hash = 'trip';
    openItem(null, {type:s.type, title:s.name, area:s.area, note:s.note, link:s.link}); },
  'setup-edit': () => openSetup(),
  'wish-owner': d => { S.wishOwner = d.id; render(); },
  'wish-filter': d => { S.wishFilter = d.f; render(); },
  'wish-add': () => openWish(null),
  'wish-open': d => { const w = S.wish.find(x => x.id === d.id); if (w) openWishView(w); },
  'wish-copy': d => { const w = S.wish.find(x => x.id === d.id); if (w) copyWish(w); },
  'wish-bought': async d => { const w = S.wish.find(x => x.id === d.id); if (!w) return; const {id, ...rest} = w; await put('wish', w.id, {...rest, bought:!w.bought, updatedAt:Date.now()}); },
  resync: () => { S.status = 'loading'; render(); sync(); },
  'me-set': d => { S.meId = d.id; LS.set('trip-me', d.id); render(); toast('已記住：這支手機是' + mName(d.id)); },
  'install-hide': () => { LS.set('trip-install-hide', true); render(); },
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(e){} deferredPrompt = null; render(); },
  'share-link': async () => {
    const url = location.origin + location.pathname + '?openExternalBrowser=1', title = (S.meta?.name || '家族旅行');
    if (navigator.share){ try { await navigator.share({title, text:title + '：行程與記帳', url}); return; } catch(e){ if (e?.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); toast('已複製連結，可以貼到 LINE'); }
    catch(e){ openModal('app 連結', `<p class="hint">長按下面的連結複製：</p><p style="word-break:break-all;user-select:all;font-weight:700">${esc(url)}</p>`); }
  }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A' || el.dataset.act !== 'pool-date') {}
  if (el.tagName === 'A' && el.dataset.act === 'pool-date') ev.preventDefault();
  fn(el.dataset, ev);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden) closeModal(); });

function route(){ const h = location.hash.slice(1); S.tab = TABS.some(t => t[0] === h) ? h : 'trip'; render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);
route();

/* ---------- data ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; render(); });
function boot(){
  S.api = String((window.TRIP_CONFIG && window.TRIP_CONFIG.apiUrl) || '').trim();
  S.meId = LS.get('trip-me', null); S.ai = LS.get('trip-ai', false);
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(S.api)){ S.status = 'noapi'; render(); return; }
  recompute();
  sync();
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  window.addEventListener('online', () => sync());
}
boot();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body></html>
